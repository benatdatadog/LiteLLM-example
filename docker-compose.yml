services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: litellm-demo-datadog-agent
    cgroup: host
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./datadog/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
      - ./datadog/conf.d/litellm.d/conf.yaml:/etc/datadog-agent/conf.d/litellm.d/conf.yaml:ro
    ports:
      - "8126:8126"
    networks:
      - litellm-demo

  litellm-proxy:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm-proxy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-demo}
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: litellm-proxy
      DD_SOURCE: litellm
      DD_VERSION: "1.0"
    volumes:
      - ./proxy/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      - datadog-agent
    networks:
      litellm-demo:
        aliases:
          - litellm-proxy

networks:
  litellm-demo:
    name: litellm-demo
